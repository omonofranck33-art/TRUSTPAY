# Chaque valeur peut être remplacée par une variable d'environnement (utile en ligne).
# Syntaxe ${NOM:valeur_par_defaut} : si NOM n'existe pas, on utilise la valeur par défaut.

# Base de données : en local par défaut, Aiven en ligne (via DB_URL)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/trustpay?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# Render impose son propre port via la variable PORT
server.port=${PORT:8080}

# Sites autorisés à appeler l'API (en ligne : mettre l'adresse exacte de ton site)
trustpay.cors=${CORS_ORIGINS:*}

# Renvoie le texte de nos erreurs (ex : "Numéro invalide") au site, au lieu d'un message vide
server.error.include-message=always
